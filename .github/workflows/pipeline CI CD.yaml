name: Test & deploy

on:
    push: 
          branches: main

jobs:
    # unit test
    unit-test:
        runs-on: ubuntu-latest 
        steps: 
             - name: clone repo
               uses: actions/checkout@v7                 

             - name: install dep
               run: npm i
              
             - name: test
               run: npm run test
    #build docker image
    build-docker-image:
        runs-on: ubuntu-latest 
        needs: unit-test
        steps: 
             - name: clone repo
               uses: actions/checkout@v7      

             - name: build image
               run: docker build -t hedilmaaoui/back-session18:v2 .
            
             - name: check image
               run: docker images


             - name: Login to Docker Hub
               uses: docker/login-action@v4
               with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

             - name: push image
               run: docker push hedilmaaoui/back-session18:v2