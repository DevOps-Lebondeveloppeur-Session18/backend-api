name: Test & deploy

on:
    push: 
          branches: main

jobs:
    # unit test
    unit-test:
        runs-on: ubuntu-latest 
        steps: 
             - name: clone repo
               uses: actions/checkout@v7                 

             - name: install dep
               run: npm i
              
             - name: test
               run: npm run test
    #build docker image
    build-docker-image:
        runs-on: ubuntu-latest 
        needs: unit-test
        steps: 
             - name: clone repo
               uses: actions/checkout@v7      

             - name: build image
               run: docker build -t hedilmaaoui/back-session18:v${{github.run_number}} .

             - name: tag latest image 
               run: docker tag hedilmaaoui/back-session18:v${{github.run_number}} hedilmaaoui/back-session18:latest

             - name: check image
               run: docker images


             - name: Login to Docker Hub
               uses: docker/login-action@v4
               with:
                  username: ${{ vars.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

             - name: push latest image
               run: docker push hedilmaaoui/back-session18:latest

      #deploy
    deploy:
        runs-on: ubuntu-latest 
        needs: build-docker-image
        steps: 
        - name: Execute remote SSH commands using password
          uses: appleboy/ssh-action@v1
          with:
            host: ${{ secrets.VPS_HOST }}
            username: ${{ secrets.VPS_USERNAME }}
            password: ${{ secrets.VPS_PASSWORD }}
            script: |
              cd /home/user/devops-script/backend
              docker compose up -d --force-recreate --pull always backend-api